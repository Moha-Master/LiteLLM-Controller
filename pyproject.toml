[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm_controller"
version = "0.2.2"
description = "A Textual TUI for managing LiteLLM proxy models"
readme = "README.md"
authors = [
    {name = "Moha-Master", email = "hongkongreporter@outlook.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0",
    "PyYAML",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/Moha-Master/LiteLLM-Controller"
Repository = "https://github.com/Moha-Master/LiteLLM-Controller.git"
GitHub = "https://github.com/Moha-Master/LiteLLM-Controller"
Issues = "https://github.com/Moha-Master/LiteLLM-Controller/issues"

[project.scripts]
litellmctl = "litellm_controller.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["litellm_controller*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
litellm_controller = ["*.tcss", "examples/*.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
# examples/ 为脚本模板（头部含 __META__ 配置块），不参与应用代码检查
extend-exclude = ["litellm_controller/examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]
