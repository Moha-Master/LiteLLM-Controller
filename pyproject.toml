[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "litellm_controller"
version = "0.1.0"
description = "A command-line tool for managing LiteLLM proxy models"
readme = "README.md"
authors = [
    {name = "Moha-Master", email = "hongkongreporter@outlook.com"},
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.9"
dependencies = [
    "InquirerPy",
    "PyYAML",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
]

[project.scripts]
litellmctl = "litellm_controller.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["litellm_controller*"]
exclude = ["tests*", "venv*"]

[tool.setuptools.package-dir]
"" = "."
